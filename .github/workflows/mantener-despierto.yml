# PB-07: el plan gratuito de Render apaga el backend tras 15 min sin tráfico y la
# primera petición tarda 12-30 s (CP-14). Este ping cada 10 min lo mantiene
# despierto en el horario de uso (07:00-23:00 de Chile, ~480 h/mes, bajo las
# 750 h gratis de Render). De noche sigue el arranque en frío (≤ 30 s, aceptable).
# Ojo: si el workspace de Render tiene OTRO servicio gratuito, sumar sus horas.
# GitHub solo ejecuta los "schedule" desde la rama por defecto (main).
name: Mantener backend despierto

on:
  schedule:
    - cron: '*/10 10-23,0-1 * * *'   # UTC; = 07:00-22:59 en Chile (UTC-3)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 -o /dev/null -w "health %{http_code} en %{time_total}s\n" https://sicteq-backend.onrender.com/api/health
